spring.application.name=polimarket-backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/polimarket}
spring.datasource.username=${DB_USERNAME:polimarket_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
# Desarrollo local: crear y actualizar tablas. En produccion usar migraciones y validate.
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}

springdoc.packages-to-scan=com.polimarket.polimarket_backend.api.controller
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
